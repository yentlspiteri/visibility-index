<title>Join your team's visibility audit | Von Peach</title>

<style>
  body { background:#fafafa; }
  .invite-logo { display:block; width:fit-content; margin: 60px auto 0; }
  .invite-logo svg { height: 28px; width: auto; display:block; }
  .invite-logo svg path { fill: var(--vp-deep-black); }

  .invite-card {
    max-width: 560px; margin: 24px auto 60px;
    background:#fff; border:1px solid rgba(12,11,9,0.08); border-radius:18px;
    overflow:hidden; box-shadow:0 1px 2px rgba(12,11,9,0.04);
  }
  .invite-hero {
    background: linear-gradient(160deg,#3F36B2 0%,#5A50CC 60%,#8683E5 100%);
    padding: 36px 32px 30px; text-align:center; color:#fafafa;
  }
  .invite-hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #EBF0FF; opacity: 0.85; margin: 0 0 14px; }
  .invite-hero h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 0; color:#fafafa; }
  .invite-hero .sub { font-size: 14px; color: #EBF0FF; opacity: 0.88; margin: 12px 0 0; }
  .invite-body { padding: 32px 32px 30px; }
  .invite-body p { margin: 0 0 14px; color: var(--vp-deep-black); line-height: 1.55; font-size: 15px; }
  .invite-body p.muted { color: var(--vp-text-grey); font-size: 14px; }

  .form-row { margin: 18px 0; }
  .form-row label { display:block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--vp-text-grey); margin-bottom: 6px; }
  .form-row input[type=text], .form-row input[type=email], .form-row input[type=url] {
    width:100%; padding: 12px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid rgba(12,11,9,0.16); border-radius: 8px; background: #fafafa; color: var(--vp-deep-black);
  }
  .form-row input:focus { outline:none; border-color: var(--vp-indigo); background:#fff; }
  .form-row .hint { font-size: 12px; color: var(--vp-text-grey); margin: 6px 0 0; }

  .check-row { display:flex; gap:10px; align-items:flex-start; margin: 22px 0 8px; padding: 14px 14px; background:#f6f4ff; border-radius:10px; }
  .check-row input { margin: 3px 0 0; accent-color: var(--vp-indigo); }
  .check-row label { font-size: 14px; color: var(--vp-deep-black); line-height: 1.5; }
  .check-row label strong { color: var(--vp-indigo); }

  .submit-btn {
    display:inline-block; width:100%; background: var(--vp-deep-black); color:#fafafa;
    border:0; padding: 14px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; font-family: inherit; cursor: pointer;
    transition: background 0.15s ease; margin-top: 8px;
  }
  .submit-btn:hover { background: var(--vp-indigo); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .privacy-note { font-size: 12px; color: var(--vp-text-grey); text-align:center; margin: 14px 0 0; line-height: 1.5; }

  .msg { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin: 16px 0 0; }
  .msg.err { background:#fdecec; color:#b91c1c; }
  .msg.ok  { background: rgba(63,54,178,0.08); color: var(--vp-indigo); }
  .state-empty { text-align:center; padding: 40px 24px; color: var(--vp-text-grey); }

  .success-state { text-align:center; padding: 36px 28px; }
  .success-state .tick { width:56px; height:56px; margin:0 auto 18px; background:linear-gradient(160deg,#3F36B2,#8683E5); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px; line-height:1; font-weight:700; }
  .success-state h2 { font-size: 22px; margin: 0 0 10px; color: var(--vp-deep-black); }
  .success-state p { color: var(--vp-text-grey); font-size: 15px; line-height: 1.6; margin: 0 0 8px; }
</style>
<script src="/tracking.js"></script>
</head>
<body>

<a class="invite-logo" href="/" aria-label="Von Peach Visibility Index — homepage">

      <path d="M272.73,511.37c-2.84-18.45-14.31-38.48-35.74-44.45-30.13-8.4-58.47.72-78.18,27.92-14.35,19.82-20.07,42.4-19.73,66.78.34,24.58,13.12,50.12,45.91,53.81,29.86,3.36,53.07-6.25,71.17-30.46,13.2-17.67,18.1-39.13,17.99-55.16-.06-8.29-.8-14.43-1.42-18.45ZM233.87,550.91c-8.82,28.87-27.2,40.35-42.54,36.46-14.35-3.63-20.57-26.26-11.38-54.86,8.15-25.37,27.57-41.52,42.54-36.46,15.02,5.08,19.23,29.16,11.38,54.86Z"/>

<div class="invite-card" id="card">
  <div class="state-empty">Loading invite…</div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const token  = params.get('token') || '';
  const card   = document.getElementById('card');

  function renderError(msg) {
    card.innerHTML = `
      <div class="invite-hero">
        <p class="eyebrow">Team visibility</p>
        <h1>This invite isn't valid.</h1>
        <p class="sub">${msg}</p>
      </div>
      <div class="invite-body">
        <p class="muted">If your manager sent you this link, the easiest fix is to ask them to share a fresh one. They can generate a new link from their dashboard.</p>
      </div>`;
  }

  function renderFull(managerEmail) {
    card.innerHTML = `
      <div class="invite-hero">
        <p class="eyebrow">Team visibility</p>
        <h1>This team is already&nbsp;full.</h1>
        <p class="sub">${managerEmail}'s team has reached the 10-seat cap.</p>
      </div>
      <div class="invite-body">
        <p class="muted">Reach out to your manager — they may need to remove someone before adding you, or contact <a href="mailto:hello@vonpeach.com">hello@vonpeach.com</a> for a larger team.</p>
      </div>`;
  }

  function renderForm(managerEmail, seatsAvailable) {
    card.innerHTML = `
      <div class="invite-hero">
        <p class="eyebrow">Team visibility · join request</p>
        <h1>${escapeHtml(managerEmail)} invited&nbsp;you.</h1>
        <p class="sub">Add yourself to their team visibility audit. Public LinkedIn data only.</p>
      </div>
      <div class="invite-body">
        <p>
          We score your public LinkedIn profile + Google footprint across six visibility dimensions and add the result to your manager's team dashboard.
          <strong>Nothing private</strong> — no DMs, no clients, no inbox. We never log in as you.
        </p>

        <form id="invite-form">
          <div class="form-row">
            <label for="linkedin_url">LinkedIn URL <span style="color:#b91c1c">*</span></label>
            <input id="linkedin_url" name="linkedin_url" type="url" placeholder="linkedin.com/in/yourname" required>
          </div>
          <div class="form-row">
            <label for="display_name">Your name (optional)</label>
            <input id="display_name" name="display_name" type="text" placeholder="So your manager sees a name, not a slug">
          </div>
          <div class="form-row">
            <label for="member_email">Your work email (optional)</label>
            <input id="member_email" name="member_email" type="email" placeholder="you@company.com">
            <p class="hint">Only used to send you a confirmation. Never shared.</p>
          </div>

          <div class="check-row">
            <input id="track" type="checkbox" checked>
            <label for="track"><strong>Include me in monthly tracking.</strong> We'll re-score your public profile on the 1st of each month so your manager can see how the team's visibility is changing over time. You can opt out any time by replying to your confirmation email.</label>
          </div>

          <button class="submit-btn" type="submit" id="submit-btn">Join the team</button>
          <p class="privacy-note">By submitting you confirm the LinkedIn URL is yours. <a href="/privacy">Privacy policy</a>.</p>
          <div id="msg" class="msg" hidden></div>
        </form>

        <p class="muted" style="margin:24px 0 0;font-size:12px;text-align:center;">${seatsAvailable} of 10 seats left on this team.</p>
      </div>`;

    document.getElementById('invite-form').addEventListener('submit', onSubmit);
  }

  function renderSuccess(managerEmail) {
    card.innerHTML = `
      <div class="success-state">
        <div class="tick">✓</div>
        <h2>You're in.</h2>
        <p>${escapeHtml(managerEmail)} will see your visibility score on their team dashboard within the next couple of minutes.</p>
        <p style="font-size:13px;margin-top:18px;">Change your mind later? Reply to your confirmation email and we'll remove you.</p>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    msg.hidden = true;
    btn.disabled = true; btn.textContent = 'Submitting…';

    const body = {
      token,
      linkedin_url: document.getElementById('linkedin_url').value.trim(),
      display_name: document.getElementById('display_name').value.trim(),
      member_email: document.getElementById('member_email').value.trim(),
      track:        document.getElementById('track').checked
    };
    try {
      const r = await fetch('/api/team-invite', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        if (window.track) window.track('team_invite_redeemed', {});
        renderSuccess(j.manager_email || 'Your manager');
        return;
      }
      msg.hidden = false; msg.className = 'msg err';
      msg.textContent = j.error || 'Could not submit. Try again shortly.';
      btn.disabled = false; btn.textContent = 'Join the team';
    } catch {
      msg.hidden = false; msg.className = 'msg err';
      msg.textContent = 'Network error. Try again.';
      btn.disabled = false; btn.textContent = 'Join the team';
    }
  }

  (async () => {
    if (!token) { renderError('No invite token in the URL.'); return; }
    try {
      const r = await fetch('/api/team-invite?token=' + encodeURIComponent(token));
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { renderError(j.error || 'This invite is no longer valid.'); return; }
      if (j.seatsAvailable <= 0) { renderFull(j.manager_email); return; }
      renderForm(j.manager_email, j.seatsAvailable);
    } catch {
      renderError('Could not load the invite. Try refreshing the page.');
    }
  })();
</script>
</body>
</html>
