<script>
  const STATES = {
    granted:  { title: "You're in.",            body: "Thanks — your manager will see your score on their dashboard. Public LinkedIn data only. You can opt out any time by replying to the email." },
    declined: { title: "Got it — you're out.",  body: "We've recorded your preference. Your score won't be tracked over time. The one-shot snapshot they already saw won't be re-run." },
    expired:  { title: "This link has expired.", body: "Reply to the email your manager sent and we'll send a fresh link. Or ignore it — nothing will happen automatically." },
    error:    { title: "Something went wrong.", body: "We couldn't process that link. Reply to your manager's email and we'll sort it out." }
  };
  const state = new URLSearchParams(location.search).get('state') || 'error';
  const cfg = STATES[state] || STATES.error;
  document.getElementById('panel').innerHTML = `
    <h1>${cfg.title}</h1>
    <p>${cfg.body}</p>
    <a class="button" href="/">Visit the Visibility Index</a>`;
</script>
